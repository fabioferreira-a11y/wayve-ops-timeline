<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayve Ops — Stuttgart Timeline</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f1; color: #1a1a18; min-height: 100vh; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1a; color: #e8e6de; } }

  /* Layout */
  .hdr { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #fff; border-bottom: 1px solid rgba(0,0,0,0.12); position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px; }
  @media (prefers-color-scheme: dark) { .hdr { background: #242422; border-color: rgba(255,255,255,0.1); } }
  .badge { background: #1a1a18; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; }
  @media (prefers-color-scheme: dark) { .badge { background: #e8e6de; color: #1a1a18; } }
  .title { font-size: 14px; font-weight: 500; margin-left: 10px; }
  .clk { font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .clkd { font-size: 11px; color: #888; text-align: right; }

  /* Buttons */
  .btn { background: #f0ede8; border: 1px solid rgba(0,0,0,0.12); border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 500; color: #5a5955; cursor: pointer; font-family: inherit; transition: background .15s; }
  .btn:hover { background: #e6e3dd; }
  .btn-primary { background: #378ADD; border-color: #378ADD; color: #fff; }
  .btn-primary:hover { background: #0C447C; border-color: #0C447C; }
  .btn-danger { background: #FAECE7; border-color: #F5C4B3; color: #4A1B0C; }
  .btn-danger:hover { background: #F5C4B3; }
  @media (prefers-color-scheme: dark) { .btn { background: #2c2c2a; border-color: rgba(255,255,255,0.1); color: #b4b2a9; } .btn:hover { background: #363634; } }

  /* Status bar */
  .sbar { display: flex; gap: 8px; padding: 12px 20px 0; flex-wrap: wrap; }
  .scard { background: #fff; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 9px 13px; flex: 1; min-width: 120px; }
  @media (prefers-color-scheme: dark) { .scard { background: #242422; border-color: rgba(255,255,255,0.08); } }
  .scard-l { font-size: 10px; color: #888; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .05em; }
  .scard-v { font-size: 12px; font-weight: 500; }

  /* Main */
  .main { padding: 12px 20px 60px; }
  .day { margin-bottom: 24px; }
  .day-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #888; margin-bottom: 7px; display: flex; align-items: center; gap: 7px; }
  .day-label::after { content: ''; flex: 1; height: 1px; background: rgba(0,0,0,0.1); }
  @media (prefers-color-scheme: dark) { .day-label::after { background: rgba(255,255,255,0.1); } }
  .day-badge { font-size: 10px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }

  /* Canvas */
  .canvas { background: #fff; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden; }
  @media (prefers-color-scheme: dark) { .canvas { background: #242422; border-color: rgba(255,255,255,0.08); } }
  .ruler { display: flex; border-bottom: 1px solid rgba(0,0,0,0.08); padding-left: 90px; padding-right: 8px; }
  .htick { flex: 1; font-size: 9px; color: #888; padding: 5px 0 4px 3px; border-left: 1px solid rgba(0,0,0,0.06); white-space: nowrap; user-select: none; }
  .htick:first-child { border-left: none; }

  /* Tracks */
  .tracks { padding: 4px 0; position: relative; }
  .track-row { display: flex; align-items: center; min-height: 54px; padding: 1px 0; }
  .track-name-wrap { width: 90px; min-width: 90px; display: flex; align-items: center; justify-content: flex-end; padding-right: 7px; gap: 3px; }
  .track-name-input { background: transparent; border: none; font-size: 11px; font-weight: 500; color: #5a5955; text-align: right; width: 65px; padding: 2px 0; outline: none; font-family: inherit; }
  .track-name-input:focus { border-bottom: 1px solid #378ADD; }
  @media (prefers-color-scheme: dark) { .track-name-input { color: #b4b2a9; } }
  .track-del-btn { opacity: 0; background: none; border: none; cursor: pointer; color: #888; font-size: 14px; padding: 0 2px; line-height: 1; transition: opacity .15s; }
  .track-row:hover .track-del-btn { opacity: 1; }
  .track-del-btn:hover { color: #E24B4A; }
  /* Vertical drag handle */
  .drag-handle { cursor: ns-resize; color: #bbb; font-size: 13px; padding: 0 4px 0 2px; line-height: 1; user-select: none; flex-shrink: 0; }
  .drag-handle:hover { color: #666; }
  .track-row.dragging-row { opacity: .4; }
  .track-row.drag-over { border-top: 2px solid #378ADD; }

  .track-inner { position: relative; flex: 1; height: 50px; border-radius: 5px; background: #f0ede8; border: 1px solid rgba(0,0,0,0.08); margin-right: 8px; }
  @media (prefers-color-scheme: dark) { .track-inner { background: #2c2c2a; border-color: rgba(255,255,255,0.07); } }

  /* Blocks */
  .block { position: absolute; top: 3px; height: 44px; border-radius: 5px; display: flex; align-items: center; padding: 0 7px; overflow: hidden; cursor: pointer; border: 1.5px solid transparent; user-select: none; transition: filter .1s; }
  .block:hover { filter: brightness(.92); }
  .block.past { opacity: .32; }
  .block.selected { outline: 2.5px solid #378ADD; outline-offset: 1px; }
  .block-inner { overflow: hidden; pointer-events: none; flex: 1; min-width: 0; }
  .block-label { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; letter-spacing: .01em; }
  .block-sub { font-size: 11px; font-weight: 600; opacity: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block-del { position: absolute; top: 1px; right: 2px; background: rgba(0,0,0,.22); border: none; border-radius: 3px; width: 13px; height: 13px; font-size: 9px; cursor: pointer; display: none; align-items: center; justify-content: center; color: #fff; padding: 0; line-height: 1; z-index: 4; }
  .block:hover .block-del { display: flex; }
  .resize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 3; }

  /* Block colors */
  .bc-blue   { background: #1464F4 !important; border-color: #0A4ED4 !important; color: #fff !important; }
  .bc-teal   { background: #00966A !important; border-color: #007050 !important; color: #fff !important; }
  .bc-amber  { background: #E87C00 !important; border-color: #C46400 !important; color: #fff !important; }
  .bc-coral  { background: #E83418 !important; border-color: #C02410 !important; color: #fff !important; }
  .bc-purple { background: #6B50F8 !important; border-color: #5038D8 !important; color: #fff !important; }
  .bc-green  { background: #3D8C00 !important; border-color: #2C6800 !important; color: #fff !important; }
  .bc-gray   { background: #5A5A5A !important; border-color: #404040 !important; color: #fff !important; }
  @media (prefers-color-scheme: dark) {
    .bc-blue   { background: #1E70FF; border-color: #1550CC; color: #fff; }
    .bc-teal   { background: #00A060; border-color: #008048; color: #fff; }
    .bc-amber  { background: #E08000; border-color: #B86600; color: #fff; }
    .bc-coral  { background: #E03818; border-color: #B82A10; color: #fff; }
    .bc-purple { background: #6850F0; border-color: #5040D0; color: #fff; }
    .bc-green  { background: #508800; border-color: #386600; color: #fff; }
    .bc-gray   { background: #686868; border-color: #505050; color: #fff; }
  }

  /* Now / deadline lines */
  .now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #E24B4A; z-index: 20; pointer-events: none; border-radius: 1px; }
  .now-label { position: absolute; top: -18px; transform: translateX(-50%); font-size: 9px; font-weight: 700; color: #E24B4A; background: #fff; border: 1px solid #E24B4A; padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .now-label { background: #242422; } }
  .deadline-line { position: absolute; top: 0; bottom: 0; width: 1.5px; background: #D85A30; z-index: 15; pointer-events: none; opacity: .65; }
  .deadline-label { position: absolute; top: -18px; transform: translateX(-50%); font-size: 9px; font-weight: 600; color: #4A1B0C; background: #FAECE7; border: 1px solid #F5C4B3; padding: 1px 4px; border-radius: 3px; white-space: nowrap; }

  /* Add block btn */
  .add-block-btn { opacity: 0; position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: #fff; border: 1px solid rgba(0,0,0,0.12); border-radius: 5px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: #888; z-index: 2; }
  .track-row:hover .add-block-btn { opacity: 1; }
  .add-block-btn:hover { background: #E6F1FB; color: #0C447C; }
  .add-track-wrap { padding: 4px 8px 8px 97px; }
  .add-track-btn { background: none; border: 1px dashed rgba(0,0,0,0.15); border-radius: 6px; padding: 4px 10px; font-size: 11px; color: #888; cursor: pointer; width: 100%; font-family: inherit; }
  .add-track-btn:hover { background: #f0ede8; color: #5a5955; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 7px 14px 9px; border-top: 1px solid rgba(0,0,0,0.07); }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #5a5955; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  @media (prefers-color-scheme: dark) { .modal-box { background: #242422; } }
  .modal-head { font-size: 15px; font-weight: 500; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; cursor: pointer; font-size: 20px; color: #888; padding: 0; line-height: 1; }
  .field { margin-bottom: 10px; }
  .field label { font-size: 11px; color: #888; display: block; margin-bottom: 3px; }
  .field input, .field textarea { width: 100%; background: #f0ede8; border: 1px solid rgba(0,0,0,0.1); border-radius: 7px; padding: 7px 10px; font-size: 13px; color: #1a1a18; font-family: inherit; outline: none; }
  .field input:focus, .field textarea:focus { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(55,138,221,.15); }
  @media (prefers-color-scheme: dark) { .field input, .field textarea { background: #2c2c2a; color: #e8e6de; border-color: rgba(255,255,255,0.1); } }
  .field textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .color-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .color-swatch { width: 24px; height: 24px; border-radius: 6px; border: 2.5px solid transparent; cursor: pointer; transition: transform .1s; }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: #1a1a18; }
  @media (prefers-color-scheme: dark) { .color-swatch.active { border-color: #e8e6de; } }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; padding: 8px; font-size: 13px; }

  /* Slack panel */
  .slack-panel { background: #f0ede8; border-top: 1px solid rgba(0,0,0,0.1); padding: 12px 20px; }
  @media (prefers-color-scheme: dark) { .slack-panel { background: #2c2c2a; border-color: rgba(255,255,255,0.08); } }
  .slack-inner { background: #fff; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px; padding: 14px 16px; max-width: 520px; margin: 0 auto; }
  @media (prefers-color-scheme: dark) { .slack-inner { background: #242422; border-color: rgba(255,255,255,0.08); } }
  .slack-head { font-size: 13px; font-weight: 500; margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; }
  .slack-out { background: #f0ede8; border: 1px solid rgba(0,0,0,0.08); border-radius: 6px; padding: 10px 12px; font-size: 12px; font-family: monospace; white-space: pre-wrap; max-height: 200px; overflow-y: auto; color: #5a5955; line-height: 1.6; margin-bottom: 10px; }
  @media (prefers-color-scheme: dark) { .slack-out { background: #2c2c2a; color: #b4b2a9; } }
  .slack-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }

  /* Toast */
  .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2000; pointer-events: none; }
  .toast { background: #1a1a18; color: #fff; font-size: 12px; padding: 7px 18px; border-radius: 20px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { .toast { background: #e8e6de; color: #1a1a18; } }

  /* unsaved dot */
  .unsaved { font-size: 11px; color: #888; margin-left: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const COLORS = ['blue','teal','amber','coral','purple','green','gray'];
const CHX = { blue:'#0050E0', teal:'#008050', amber:'#D07000', coral:'#CC3010', purple:'#5040E0', green:'#407800', gray:'#505050' };

const DEFAULT = { days: [
  { id:'d1', label:'Demo day', badge:'DEMO DAY', bgs:'#E1F5EE', bgc:'#085041', sh:6, eh:15, dls:[{t:'12:30',l:'Arrival deadline'}], tracks:[
    { id:'t6', n:'Recce', blocks:[{ id:'b6', s:'06:30', e:'08:00', c:'gray', l:'Morning recce', sub:'Full team', no:'Route reconnaissance and final check before demos.' }]},
    { id:'t7', n:'Daniel', blocks:[
      { id:'b7', s:'09:00', e:'10:00', c:'blue', l:'Bosch demo', sub:'Runs', no:'Daniel runs the Bosch demo. Afterwards travels to Zuffenhausen for a final recce.' },
      { id:'b8', s:'10:00', e:'12:30', c:'teal', l:'Zuffenhausen recce', sub:'Final prep', no:'Travels to Zuffenhausen for a final recce before the main demo.' },
    ]},
    { id:'t8', n:'Marius', blocks:[
      { id:'b9', s:'10:00', e:'11:00', c:'coral', l:'IVECO demo', sub:'Parallel', no:'IVECO demo in parallel with Karlheinz.' },
      { id:'b10', s:'11:00', e:'11:30', c:'gray', l:'Lunch break', sub:'30 min', no:'30-minute lunch break before heading to Zuffenhausen.' },
      { id:'b11', s:'11:30', e:'12:45', c:'teal', l:'Travel to Zuffenhausen', sub:'Arrive by 12:30', no:'Must arrive on-site between 12:30 and 12:45.' },
    ]},
    { id:'t9', n:'Karlheinz', blocks:[
      { id:'b12', s:'10:00', e:'11:00', c:'coral', l:'IVECO demo', sub:'Parallel', no:'IVECO demo in parallel with Marius.' },
      { id:'b13', s:'11:00', e:'11:30', c:'gray', l:'Lunch break', sub:'30 min', no:'30-minute lunch break.' },
      { id:'b14', s:'11:30', e:'12:45', c:'teal', l:'Travel to Zuffenhausen', sub:'Arrive by 12:30', no:'Arrival deadline: 12:30–12:45.' },
    ]},
    { id:'t10', n:'Copis', blocks:[] },
    { id:'t11', n:'Demo', blocks:[{ id:'b15', s:'13:15', e:'14:30', c:'green', l:'Zuffenhausen demo', sub:'Full team', no:'Main demo in Zuffenhausen. Full team on-site. Kick-off ~13:15.' }]},
  ]},
  { id:'d2', label:'Day 3 — assign as needed', badge:'DAY 3', bgs:'#EEEDFE', bgc:'#26215C', sh:7, eh:19, dls:[], tracks:[
    { id:'t12', n:'Daniel', blocks:[] }, { id:'t13', n:'Marius', blocks:[] },
    { id:'t14', n:'Karlheinz', blocks:[] }, { id:'t15', n:'Ahmed', blocks:[] },
    { id:'t16', n:'Copis', blocks:[] },
  ]},
]};

let _uid = 500;
const nid = () => 'x' + (++_uid);
const t2m = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const m2t = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const frac = (t, sh, eh) => Math.max(0, Math.min(1, (t2m(t) - sh*60) / ((eh-sh)*60)));
const clone = o => JSON.parse(JSON.stringify(o));

function loadData() {
  try { const s = localStorage.getItem('wayve_ops_v19'); if (s) return JSON.parse(s); } catch(e) {}
  return clone(DEFAULT);
}

// ── MODAL ──────────────────────────────────────────────────────────────────
function Modal({ block, onClose, onSave, onDelete }) {
  const [form, setForm] = useState({ l: block.l, sub: block.sub || '', s: block.s, e: block.e, no: block.no || '', c: block.c });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  useEffect(() => {
    const handler = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box">
        <div className="modal-head">
          Edit block
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="field">
          <label>Label</label>
          <input type="text" value={form.l} onChange={e => set('l', e.target.value)} autoFocus />
        </div>
        <div className="field">
          <label>Sub-label</label>
          <input type="text" value={form.sub} onChange={e => set('sub', e.target.value)} placeholder="e.g. Zuffenhausen route" />
        </div>
        <div className="field field-row">
          <div className="field" style={{margin:0}}>
            <label>Start</label>
            <input type="time" value={form.s} onChange={e => set('s', e.target.value)} />
          </div>
          <div className="field" style={{margin:0}}>
            <label>End</label>
            <input type="time" value={form.e} onChange={e => set('e', e.target.value)} />
          </div>
        </div>
        <div className="field">
          <label>Notes</label>
          <textarea value={form.no} onChange={e => set('no', e.target.value)} placeholder="Car, status, notes…" />
        </div>
        <div className="field">
          <label>Color</label>
          <div className="color-row">
            {COLORS.map(c => (
              <div key={c} className={`color-swatch ${form.c === c ? 'active' : ''}`}
                style={{ background: CHX[c] }}
                onClick={() => set('c', c)}
                title={c} />
            ))}
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-danger" onClick={onDelete}>Delete</button>
          <button className="btn btn-primary" onClick={() => onSave(form)}>Apply</button>
        </div>
      </div>
    </div>
  );
}

// ── BLOCK ──────────────────────────────────────────────────────────────────
function Block({ block, day, track, onEdit, onDelete, onChange, onMoveToTrack, nowFrac }) {
  const fs = frac(block.s, day.sh, day.eh);
  const fe = frac(block.e, day.sh, day.eh);
  const isPast = nowFrac !== null && fe < nowFrac && day.id === 'd1';

  const handleMouseDown = e => {
    if (e.target.classList.contains('resize-handle') || e.target.classList.contains('block-del')) return;
    if (e.button !== 0) return;
    e.preventDefault();
    const container = e.currentTarget.closest('.track-inner');
    if (!container) return;
    const rect = container.getBoundingClientRect();
    const total = (day.eh - day.sh) * 60;
    const startX = e.clientX, startY = e.clientY;
    const origLeft = fs, width = fe - fs;
    let moved = false, crossTrack = false;

    // ghost block that follows cursor when dragging across tracks
    const ghost = document.createElement('div');
    ghost.style.cssText = `position:fixed;height:34px;background:rgba(55,138,221,0.25);border:2px dashed #378ADD;border-radius:5px;pointer-events:none;z-index:500;display:none;min-width:60px;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#378ADD;`;
    ghost.textContent = block.l;
    document.body.appendChild(ghost);

    // highlight line for target track
    const line = document.createElement('div');
    line.style.cssText = 'position:fixed;left:0;right:0;height:2px;background:#378ADD;z-index:499;pointer-events:none;display:none;';
    document.body.appendChild(line);

    let targetTrackId = null;

    const onMove = ev => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!moved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) moved = true;
      if (!moved) return;

      const absDy = Math.abs(dy), absDx = Math.abs(dx);

      // if mostly vertical → cross-track mode
      if (absDy > 20 && absDy > absDx * 0.8) {
        crossTrack = true;
        ghost.style.display = 'flex';
        ghost.style.left = (ev.clientX - 40) + 'px';
        ghost.style.top = (ev.clientY - 17) + 'px';
        ghost.style.width = Math.max((width) * rect.width, 80) + 'px';
        line.style.display = 'block';

        // find target track-inner under cursor
        targetTrackId = null;
        document.querySelectorAll('.track-inner').forEach(ti => {
          const r = ti.getBoundingClientRect();
          if (ev.clientY >= r.top - 10 && ev.clientY <= r.bottom + 10) {
            const tid = ti.dataset.trackId;
            if (tid !== track.id) {
              targetTrackId = tid;
              line.style.top = (r.top - 1) + 'px';
              line.style.display = 'block';
            }
          }
        });
        if (!targetTrackId) line.style.display = 'none';
      } else {
        // horizontal drag — update position in same track
        crossTrack = false;
        ghost.style.display = 'none';
        line.style.display = 'none';
        targetTrackId = null;
        const nl = Math.max(0, Math.min(origLeft + dx / rect.width, 1 - width));
        const ns = Math.round((nl * total + day.sh * 60) / 5) * 5;
        const dur = t2m(block.e) - t2m(block.s);
        onChange({ ...block, s: m2t(ns), e: m2t(ns + dur) });
      }
    };

    const onUp = ev => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      ghost.remove(); line.remove();
      if (!moved) { onEdit(); return; }
      if (crossTrack && targetTrackId) {
        onMoveToTrack(block, targetTrackId);
      }
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };

  const handleResizeDown = e => {
    e.preventDefault(); e.stopPropagation();
    const container = e.currentTarget.closest('.track-inner');
    if (!container) return;
    const rect = container.getBoundingClientRect();
    const total = (day.eh - day.sh) * 60;
    const startX = e.clientX, origEf = fe;
    const onMove = ev => {
      const dx = (ev.clientX - startX) / rect.width;
      const nef = Math.max(fs + 0.02, Math.min(1, origEf + dx));
      onChange({ ...block, e: m2t(Math.round((nef * total + day.sh * 60) / 5) * 5) });
    };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };

  return (
    <div
      className={`block bc-${block.c}${isPast ? ' past' : ''}`}
      style={{ left: (fs * 100) + '%', width: Math.max((fe - fs) * 100, 0.5) + '%' }}
      title={block.no || block.l}
      onMouseDown={handleMouseDown}
    >
      <div className="block-inner">
        <div className="block-label">{block.l}</div>
        {block.sub && <div className="block-sub">{block.sub}</div>}
      </div>
      <button className="block-del" onClick={e => { e.stopPropagation(); onDelete(); }}>×</button>
      <div className="resize-handle" onMouseDown={handleResizeDown} />
    </div>
  );
}

// ── DAY ────────────────────────────────────────────────────────────────────
function DayView({ day, nowFrac, onUpdateDay }) {
  const updateTrack = (tid, newTrack) => {
    onUpdateDay({ ...day, tracks: day.tracks.map(t => t.id === tid ? newTrack : t) });
  };
  // Move a block from its current track to another track
  const moveBlockToTrack = (block, toTrackId) => {
    const newTracks = day.tracks.map(t => {
      if (t.id === block._fromTrack) return { ...t, blocks: t.blocks.filter(b => b.id !== block.id) };
      if (t.id === toTrackId) return { ...t, blocks: [...t.blocks, block] };
      return t;
    });
    onUpdateDay({ ...day, tracks: newTracks });
  };
  const deleteTrack = tid => {
    if (day.tracks.length <= 1) return;
    onUpdateDay({ ...day, tracks: day.tracks.filter(t => t.id !== tid) });
  };
  const addTrack = () => {
    const newTrack = { id: nid(), n: 'New person', blocks: [] };
    onUpdateDay({ ...day, tracks: [...day.tracks, newTrack] });
  };
  // Move dragged track (fromId) to before/after target track (toId)
  const moveTrack = (fromId, toId, before) => {
    const tracks = [...day.tracks];
    const fromIdx = tracks.findIndex(t => t.id === fromId);
    let toIdx     = tracks.findIndex(t => t.id === toId);
    if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;
    const [moved] = tracks.splice(fromIdx, 1);
    // recalculate toIdx after splice
    toIdx = tracks.findIndex(t => t.id === toId);
    tracks.splice(before ? toIdx : toIdx + 1, 0, moved);
    onUpdateDay({ ...day, tracks });
  };

  const seen = new Set();
  day.tracks.forEach(tr => tr.blocks.forEach(b => seen.add(b.c)));

  return (
    <div className="day">
      <div className="day-label">
        <span className="day-badge" style={{ background: day.bgs, color: day.bgc }}>{day.badge}</span>
        {day.label}
      </div>
      <div className="canvas">
        <div className="ruler">
          {Array.from({ length: day.eh - day.sh }, (_, i) => (
            <div key={i} className="htick">{String(day.sh + i).padStart(2, '0')}:00</div>
          ))}
        </div>
        <div className="tracks" style={{ position: 'relative' }}>
          {day.tracks.map(track => (
            <TrackRow key={track.id} track={track} day={day} nowFrac={nowFrac}
              onUpdate={t => updateTrack(track.id, t)}
              onDelete={() => deleteTrack(track.id)}
              onMoveUp={moveTrack}
              onMoveToTrack={(block, toId) => moveBlockToTrack({...block, _fromTrack: track.id}, toId)} />
          ))}
          {day.dls && day.dls.map((dl, i) => {
            const f = frac(dl.t, day.sh, day.eh);
            if (f <= 0 || f >= 1) return null;
            return (
              <div key={i} className="deadline-line"
                style={{ left: `calc(90px + ${f} * (100% - 90px))`, top: 18, bottom: 0, position: 'absolute' }}>
                <div className="deadline-label">{dl.l}</div>
              </div>
            );
          })}
          <div className="add-track-wrap">
            <button className="add-track-btn" onClick={addTrack}>+ Add person / track</button>
          </div>
        </div>
        {seen.size > 0 && (
          <div className="legend">
            {day.tracks.filter(tr => tr.blocks.length > 0).map(tr => (
              <div key={tr.id} className="legend-item">
                <div className="legend-dot" style={{ background: CHX[tr.blocks[0].c] }} />
                {tr.n}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── TRACK ROW ──────────────────────────────────────────────────────────────
function TrackRow({ track, day, nowFrac, onUpdate, onDelete, onMoveUp, onMoveToTrack }) {
  const [editBlock, setEditBlock] = useState(null);
  const innerRef = useRef(null);
  const rowRef = useRef(null);

  const updateBlock = (bid, newBlk) => onUpdate({ ...track, blocks: track.blocks.map(b => b.id === bid ? newBlk : b) });
  const deleteBlock = bid => onUpdate({ ...track, blocks: track.blocks.filter(b => b.id !== bid) });

  const nowF = day.id === 'd1' ? nowFrac : null;

  const handleTrackClick = e => {
    if (e.target.closest('.block') || e.target.closest('.drag-handle')) return;
    const rect = innerRef.current.getBoundingClientRect();
    const clickFrac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const total = (day.eh - day.sh) * 60;
    const startMins = Math.round((clickFrac * total + day.sh * 60) / 5) * 5;
    const endMins = Math.min(startMins + 60, day.eh * 60);
    const newBlock = { id: nid(), s: m2t(startMins), e: m2t(endMins), c: 'blue', l: '', sub: '', no: '' };
    onUpdate({ ...track, blocks: [...track.blocks, newBlock] });
    setEditBlock(newBlock);
  };

  // Mousedown vertical reorder
  const handleHandleMouseDown = e => {
    e.preventDefault();
    const rowEl = rowRef.current;
    let didMove = false;

    // highlight line element
    const line = document.createElement('div');
    line.style.cssText = 'position:fixed;left:0;right:0;height:3px;background:#378ADD;z-index:9999;pointer-events:none;border-radius:2px;display:none;';
    document.body.appendChild(line);

    let dropTargetId = null;
    let dropBefore = true;

    const onMove = ev => {
      if (!didMove) { didMove = true; rowEl.style.opacity = '0.3'; line.style.display = 'block'; }
      document.querySelectorAll('.track-row').forEach(r => {
        r.style.borderTop = '';
        r.style.borderBottom = '';
      });
      dropTargetId = null;
      document.querySelectorAll('.track-row').forEach(r => {
        if (r === rowEl) return;
        const rect = r.getBoundingClientRect();
        if (ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
          const mid = rect.top + rect.height / 2;
          dropBefore = ev.clientY < mid;
          dropTargetId = r.dataset.trackId;
          line.style.top = (dropBefore ? rect.top : rect.bottom) - 1.5 + 'px';
        }
      });
      if (!dropTargetId) line.style.display = 'none';
    };

    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      rowEl.style.opacity = '';
      line.remove();
      if (dropTargetId && dropTargetId !== track.id) {
        onMoveUp(track.id, dropTargetId, dropBefore);
      }
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };

  return (
    <>
      {editBlock && (
        <Modal
          block={editBlock}
          onClose={() => { deleteBlock(editBlock.id); setEditBlock(null); }}
          onSave={form => { updateBlock(editBlock.id, { ...editBlock, ...form }); setEditBlock(null); }}
          onDelete={() => { deleteBlock(editBlock.id); setEditBlock(null); }}
        />
      )}
      <div className="track-row" ref={rowRef} data-track-id={track.id}>
        <div className="track-name-wrap">
          <span className="drag-handle" title="Drag to reorder" onMouseDown={handleHandleMouseDown}>⠿</span>
          <button className="track-del-btn" onClick={onDelete} title="Remove track">×</button>
          <input className="track-name-input" defaultValue={track.n} spellCheck={false}
            onBlur={e => onUpdate({ ...track, n: e.target.value })} />
        </div>
        <div className="track-inner" ref={innerRef} data-track-id={track.id} style={{ position: 'relative', cursor: 'crosshair' }}
          onClick={handleTrackClick}>
          {track.blocks.map(block => (
            <Block key={block.id} block={block} day={day} track={track}
              nowFrac={nowF}
              onEdit={() => setEditBlock(block)}
              onDelete={() => deleteBlock(block.id)}
              onChange={nb => updateBlock(block.id, nb)}
              onMoveToTrack={onMoveToTrack} />
          ))}
          {nowF !== null && nowF > 0 && nowF < 1 && (
            <div className="now-line" style={{ left: (nowF * 100) + '%' }}>
              <div className="now-label" id={`nl-${track.id}`}></div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

// ── SLACK PANEL ────────────────────────────────────────────────────────────
function SlackPanel({ data, onClose }) {
  const [copied, setCopied] = useState(false);
  const lines = ['*Wayve Stuttgart Ops — Schedule*', ''];
  data.days.forEach(day => {
    lines.push(`*${day.badge} — ${day.label}*`);
    day.tracks.forEach(tr => {
      if (!tr.blocks.length) return;
      const bs = tr.blocks.map(b => `${b.s}–${b.e} ${b.l}${b.sub ? ' (' + b.sub + ')' : ''}`).join(' | ');
      lines.push(`• *${tr.n}:* ${bs}`);
    });
    lines.push('');
  });
  lines.push(':warning: Zuffenhausen arrival deadline: *12:30–12:45*');
  const text = lines.join('\n');

  const copy = () => {
    navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  };

  return (
    <div className="slack-panel">
      <div className="slack-inner">
        <div className="slack-head">
          Slack export
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="slack-out">{text}</div>
        <div className="slack-actions">
          {copied && <span style={{ fontSize: 12, color: '#1D9E75' }}>Copied!</span>}
          <button className="btn btn-primary" onClick={copy}>Copy to clipboard</button>
        </div>
      </div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(loadData);
  const [dirty, setDirty] = useState(false);
  const [time, setTime] = useState(new Date());
  const [showSlack, setShowSlack] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    const id = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  const showToast = msg => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  const updateData = newData => { setData(newData); setDirty(true); };
  const saveData = () => { localStorage.setItem('wayve_ops_v19', JSON.stringify(data)); setDirty(false); showToast('Saved'); };
  const resetData = () => { if (!confirm('Reset to default?')) return; localStorage.removeItem('wayve_ops_v19'); setData(clone(DEFAULT)); setDirty(false); showToast('Reset'); };

  const updateDay = newDay => updateData({ ...data, days: data.days.map(d => d.id === newDay.id ? newDay : d) });

  const hh = String(time.getHours()).padStart(2, '0');
  const mm = String(time.getMinutes()).padStart(2, '0');
  const ss = String(time.getSeconds()).padStart(2, '0');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const nowFrac = frac(hh + ':' + mm, data.days[0].sh, data.days[0].eh);

  // Status bar
  const dl = new Date(); dl.setDate(dl.getDate() + 1); dl.setHours(12, 30, 0, 0);
  const diff = dl - time;
  const cd = diff > 0 ? `${Math.floor(diff/3600000)}h ${Math.floor((diff%3600000)/60000)}min remaining` : diff > -3600000 ? `Passed ${Math.floor(-diff/60000)}min ago` : 'Done';
  const phases = [
    {d:0,s:'07:00',e:'09:30',l:'Daniel — CLA validation'},{d:0,s:'09:00',e:'13:00',l:'Marius — familiarisation'},{d:0,s:'14:00',e:'18:30',l:'Ahmed — Valeo validation'},
    {d:1,s:'06:30',e:'08:00',l:'Morning recce'},{d:1,s:'09:00',e:'10:00',l:'Bosch demo (Daniel)'},{d:1,s:'10:00',e:'11:00',l:'Parallel IVECO demos'},
    {d:1,s:'11:00',e:'11:30',l:'Lunch break'},{d:1,s:'11:30',e:'12:45',l:'Travel to Zuffenhausen'},{d:1,s:'13:15',e:'14:30',l:'Zuffenhausen demo'},
  ];
  let cur = '—', nxt = '—', gotNxt = false;
  phases.forEach(p => {
    const ref = new Date(); if (p.d === 1) ref.setDate(ref.getDate() + 1);
    const [sh,sm] = p.s.split(':').map(Number), [eh,em] = p.e.split(':').map(Number);
    const ps = new Date(ref); ps.setHours(sh,sm,0,0);
    const pe = new Date(ref); pe.setHours(eh,em,0,0);
    if (time >= ps && time < pe) cur = p.l;
    if (time < ps && !gotNxt) { nxt = p.l + ' (' + p.s + ')'; gotNxt = true; }
  });

  // update now labels
  useEffect(() => {
    document.querySelectorAll('[id^="nl-"]').forEach(el => { el.textContent = hh + ':' + mm; });
  }, [hh, mm]);

  return (
    <>
      <div className="hdr">
        <div style={{ display:'flex', alignItems:'center' }}>
          <span className="badge">WAYVE</span>
          <span className="title">Stuttgart Ops</span>
          {dirty && <span className="unsaved">· unsaved</span>}
        </div>
        <div style={{ display:'flex', gap:6 }}>
          <button className="btn" onClick={resetData}>Reset</button>
          <button className="btn" onClick={() => setShowSlack(s => !s)}>Slack export</button>
          <button className="btn btn-primary" onClick={saveData}>Save</button>
        </div>
        <div>
          <div className="clk">{hh}:{mm}:{ss}</div>
          <div className="clkd">{days[time.getDay()]}, {time.getDate()} {months[time.getMonth()]}</div>
        </div>
      </div>

      <div className="sbar">
        <div className="scard"><div className="scard-l">Current phase</div><div className="scard-v">{cur}</div></div>
        <div className="scard"><div className="scard-l">Next phase</div><div className="scard-v">{nxt}</div></div>
        <div className="scard"><div className="scard-l">Zuffenhausen deadline</div><div className="scard-v">{cd}</div></div>
      </div>

      <div className="main">
        {data.days.map((day, i) => (
          <DayView key={day.id} day={day} nowFrac={nowFrac}
            onUpdateDay={updateDay} />
        ))}
      </div>

      {showSlack && <SlackPanel data={data} onClose={() => setShowSlack(false)} />}
      {toast && <div className="toast-wrap"><div className="toast">{toast}</div></div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
